<section class="events-section">
    <div class="container">
        <h2 class="section-title">Upcoming Events</h2>
        
        <div style="text-align: center; margin-bottom: 20px; margin-top: 0px;">
            <button class="btn btn-primary" id="addEventBtn">Add Event</button>
        </div>
        <div class="events-container" id="eventsContainer">
            <!-- Events will be dynamically loaded here -->
        </div>
    </div>
</section>

<!-- Add Event Dialog -->
<div class="dialog-overlay" id="addEventDialog">
    <div class="dialog-box">
        <div class="dialog-header">
            <h3 class="dialog-title">Add New Event</h3>
            <button class="dialog-close" id="closeEventDialog">&times;</button>
        </div>
        <div class="dialog-body">
            <form id="addEventForm">
                <div class="form-group">
                    <label for="eventTitle">Event Title</label>
                    <input type="text" id="eventTitle" class="form-control" placeholder="Enter event title" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Date</label>
                        <input type="date" id="eventDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Time</label>
                        <input type="time" id="eventTime" class="form-control" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventLocation">Location</label>
                        <input type="text" id="eventLocation" class="form-control" placeholder="Enter event location" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="eventOrganization">Organizer</label>
                    <input type="text" id="eventOrganization" class="form-control" placeholder="Enter organizer name" required>
                </div>
                <div class="form-group">
                    <label for="eventPhoto">Event Photo</label>
                    <input type="file" id="eventPhoto" class="form-control" accept="image/*" placeholder="Upload event photo">
                    <div id="eventPhotoPreview" style="margin-top: 10px;"></div>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Event Description</label>
                    <textarea id="eventDescription" class="form-control" placeholder="Describe the event, what to expect, etc." required></textarea>
                </div>
            </form>
        </div>
        <div class="dialog-footer">
            <button class="btn btn-outline" id="cancelEvent">Cancel</button>
            <button class="btn btn-primary" id="submitEvent">Add Event</button>
        </div>
    </div>
</div>
