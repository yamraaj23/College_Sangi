<section class="forum-section">
    <div class="container">
        <h2 class="section-title">Question Bank</h2>
        
        <!-- University, Course, Year and Semester Filters for Question Bank - All in One Line -->
        <div class="form-row" style="margin-bottom: 15px; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
            <div class="form-group" style="flex: 1; min-width: 180px;">
                <label for="questionBankUniversityInput">University</label>
                <div class="filter-input-wrapper">
                    <input id="questionBankUniversityInput" type="text" class="form-control" placeholder="Type to filter universities..." />
                    <div id="questionBankUniversityDropdown" class="filter-dropdown-list"></div>
                </div>
            </div>
            
            <div class="form-group" style="flex: 1; min-width: 150px;">
                <label for="questionBankCourseInput">Course</label>
                <div class="filter-input-wrapper">
                    <input id="questionBankCourseInput" type="text" class="form-control" placeholder="Type to filter courses..." />
                    <div id="questionBankCourseDropdown" class="filter-dropdown-list"></div>
                </div>
            </div>

            <div class="form-group" style="flex: 1; min-width: 150px;">
                <label for="bsStartingInput">Exam Year</label>
                <div class="filter-input-wrapper">
                    <input id="bsStartingInput" type="text" class="form-control" placeholder="Type academic year..." />
                    <div id="bsStartingDropdown" class="filter-dropdown-list"></div>
                </div>
            </div>

            <div class="form-group" style="flex: 1; min-width: 150px;">
                <label for="yearFilter">Year</label>
                <select id="yearFilter" class="form-control">
                    <option value="all">All Years</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                </select>
            </div>

            <div class="form-group" style="flex: 1; min-width: 160px;">
                <label for="semesterFilter">Semester</label>
                <select id="semesterFilter" class="form-control">
                    <option value="all">All Semesters</option>
                    <option value="1">First Semester</option>
                    <option value="2">Second Semester</option>
                    <option value="3">Third Semester</option>
                    <option value="4">Fourth Semester</option>
                    <option value="5">Fifth Semester</option>
                    <option value="6">Sixth Semester</option>
                    <option value="7">Seventh Semester</option>
                    <option value="8">Eighth Semester</option>
                </select>
            </div>
        </div>
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="btn btn-primary" id="uploadQuestionBtn">
                <i class="fas fa-plus"></i> Upload Question Photo
            </button>
        </div>
        
        <div class="question-photos" id="questionPhotosContainer">
            <!-- Question photos will be dynamically loaded here -->
        </div>
        
        <div id="emptyQuestionBankMessage" style="display: none; text-align: center; padding: 20px 20px 30px; color: var(--text-light);">
            <div style="width: 82px; height: 82px; border-radius: 50%; background: #c7ccd0; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                <i class="fas fa-question" style="font-size: 2.5rem; color: #ffffff; line-height: 1;"></i>
            </div>
            <h3 style="margin: 0 0 8px; color: #1f1f1f; font-size: clamp(1.6rem, 2.3vw, 2.2rem); font-weight: 400; line-height: 1.2;">No Questions Yet</h3>
            <p style="margin: 0; color: #5f6a74; font-size: clamp(1rem, 1.3vw, 1.3rem); font-style: italic;">No questions found matching your filters.</p>
        </div>
    </div>
</section>

<!-- Upload Question Dialog -->
<div class="dialog-overlay" id="uploadQuestionDialog">
    <div class="dialog-box">
        <div class="dialog-header">
            <h3 class="dialog-title">Upload Question Photo</h3>
            <button class="dialog-close" id="closeQuestionDialog">&times;</button>
        </div>
        <div class="dialog-body">
            <form id="uploadQuestionForm">
                <div class="question-upload-container">
                    <div class="form-group">
                        <label for="questionTitle">Question Title</label>
                        <input type="text" id="questionTitle" class="form-control" placeholder="Enter a title for this question" required>
                    </div>
                    
                    <div class="form-row" style="display: flex; gap: 12px; align-items: flex-start;">
                        <div class="form-group" style="flex: 1;">
                            <label>Question Photo</label>
                            <div class="image-preview" id="questionImagePreview">
                                <div class="image-preview-placeholder">
                                    <i class="fas fa-image"></i>
                                    <p>No image selected</p>
                                </div>
                            </div>
                            <div class="file-input-wrapper" style="margin-top: 8px;">
                                <button type="button" class="btn btn-outline" style="width: 100%;">
                                    <i class="fas fa-upload"></i> Choose Image
                                </button>
                                <input type="file" id="questionImage" accept="image/*" required>
                            </div>
                            <div style="display: flex; gap: 8px; margin-top: 12px; justify-content: flex-start;">
                                <button class="btn btn-outline" id="cancelQuestion">Cancel</button>
                                <button class="btn btn-primary" id="submitQuestion">Upload Question</button>
                            </div>
                        </div>
                        
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                            <div class="form-group">
                                <label for="questionUniversity">University</label>
                                <div class="filter-input-wrapper">
                                    <input id="questionUniversity" type="text" class="form-control" placeholder="Type or select university" required />
                                    <div id="questionUniversityDropdown" class="filter-dropdown-list"></div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="questionBsStarting">Exam Year</label>
                                <div class="filter-input-wrapper">
                                    <input id="questionBsStarting" type="text" class="form-control" placeholder="Type or select exam year" />
                                    <div id="questionBsStartingDropdown" class="filter-dropdown-list"></div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="questionCourse">Course</label>
                                <div class="filter-input-wrapper">
                                    <input id="questionCourse" type="text" class="form-control" placeholder="Type or select course" required />
                                    <div id="questionCourseDropdown" class="filter-dropdown-list"></div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="questionYear">Year</label>
                                <select id="questionYear" class="form-control" required>
                                    <option value="">Select year</option>
                                    <option value="1">First Year</option>
                                    <option value="2">Second Year</option>
                                    <option value="3">Third Year</option>
                                    <option value="4">Fourth Year</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="questionSemester">Semester</label>
                                <select id="questionSemester" class="form-control" required>
                                    <option value="">Select semester</option>
                                    <option value="1">First Semester</option>
                                    <option value="2">Second Semester</option>
                                    <option value="3">Third Semester</option>
                                    <option value="4">Fourth Semester</option>
                                    <option value="5">Fifth Semester</option>
                                    <option value="6">Sixth Semester</option>
                                    <option value="7">Seventh Semester</option>
                                    <option value="8">Eighth Semester</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- Delete Question Confirmation Dialog -->
<div id="deleteQuestionConfirmDialog" class="delete-question-dialog">
    <div class="delete-question-content">
        <div class="delete-question-header">
            <div class="delete-question-icon">⚠️</div>
            <div class="delete-question-title">Delete Question?</div>
        </div>
        <div class="delete-question-body">
            <p class="delete-question-message">Are you sure you want to delete this question photo?</p>
            <p class="delete-question-sub-message">This action cannot be undone and the question will be permanently removed.</p>
        </div>
        <div class="delete-question-footer">
            <button class="delete-question-cancel-btn" id="deleteQuestionCancelBtn">Cancel</button>
            <button class="delete-question-delete-btn" id="deleteQuestionConfirmBtn">Delete</button>
        </div>
    </div>
</div>
