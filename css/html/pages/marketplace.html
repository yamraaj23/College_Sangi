<section class="marketplace-section">
    <div class="container">
        <h2 class="section-title">Textbook Marketplace</h2>
        
        <!-- University and Course Filters for Marketplace -->
        <div class="marketplace-filters" style="margin-bottom: 15px;">
            <div class="form-group" style="margin-bottom: 15px; min-width: 200px;">
                <label for="marketplaceUniversityInput">University</label>
                <div class="filter-input-wrapper">
                    <input id="marketplaceUniversityInput" type="text" class="form-control" placeholder="Type to filter universities..." />
                    <div id="marketplaceUniversityDropdown" class="filter-dropdown-list"></div>
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 15px; min-width: 150px;">
                <label for="marketplaceCourseInput">Course</label>
                <div class="filter-input-wrapper">
                    <input id="marketplaceCourseInput" type="text" class="form-control" placeholder="Type to filter courses..." />
                    <div id="marketplaceCourseDropdown" class="filter-dropdown-list"></div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 15px; display: flex; align-items: flex-end; margin-left: auto;">
                <button class="btn btn-primary" id="addProductBtn">Sell Your Textbook</button>
            </div>
        </div>
        
        <!-- category filter buttons removed per request -->
        <div class="marketplace-grid" id="marketplaceGrid">
            <!-- Products will be dynamically loaded here -->
        </div>
    </div>
</section>

<!-- Add Textbook Dialog -->
<div class="dialog-overlay" id="addTextbookDialog">
    <div class="dialog-box">
        <div class="dialog-header">
            <h3 class="dialog-title">Sell Your Textbook</h3>
            <button class="dialog-close" id="closeTextbookDialog">&times;</button>
        </div>
        <div class="dialog-body">
            <form id="addTextbookForm">
                <div class="form-row" style="display: flex; gap: 12px; align-items: flex-start;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                        <div class="form-group">
                            <label for="textbookTitle">Textbook Title</label>
                            <input type="text" id="textbookTitle" class="form-control" placeholder="Enter textbook title" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="textbookUniversity">University</label>
                            <div class="filter-input-wrapper">
                                <input id="textbookUniversity" type="text" class="form-control" placeholder="Type or select university" required />
                                <div id="textbookUniversityDropdown" class="filter-dropdown-list"></div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="textbookCourse">Course</label>
                            <div class="filter-input-wrapper">
                                <input id="textbookCourse" type="text" class="form-control" placeholder="Type or select course" required />
                                <div id="textbookCourseDropdown" class="filter-dropdown-list"></div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="textbookPrice">Price (NPR)</label>
                            <input type="number" id="textbookPrice" class="form-control" placeholder="Enter price in NPR" min="0" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="textbookCondition">Condition</label>
                            <select id="textbookCondition" class="form-control" required>
                                <option value="">Select condition</option>
                                <option value="Like New">Like New</option>
                                <option value="Good">Good</option>
                                <option value="Fair">Fair</option>
                                <option value="Poor">Poor</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="textbookDescription">Description</label>
                            <textarea id="textbookDescription" class="form-control" placeholder="Describe the textbook condition, any highlights, etc."></textarea>
                        </div>
                    </div>
                    
                    <div style="flex: 1;">
                        <div class="form-group">
                            <label>Textbook Photo/PDF</label>
                            <div class="image-preview" id="textbookImagePreview">
                                <div class="image-preview-placeholder">
                                    <i class="fas fa-image"></i>
                                    <p>No file selected</p>
                                </div>
                            </div>
                            <div class="file-input-wrapper" style="margin-top: 10px;">
                                <button type="button" class="btn btn-outline" style="width: 100%;">
                                    <i class="fas fa-upload"></i> Choose File (Image or PDF)
                                </button>
                                <input type="file" id="textbookImage" accept="image/*,.pdf" required>
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 12px; justify-content: center;">
                    <button class="btn btn-outline" id="cancelTextbook">Cancel</button>
                    <button class="btn btn-primary" id="submitTextbook">List Textbook</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- Delete Product Confirmation Dialog -->
<div id="deleteProductConfirmDialog" class="delete-product-dialog">
    <div class="delete-product-content">
        <div class="delete-product-header">
            <div class="delete-product-icon">⚠️</div>
            <div class="delete-product-title">Delete Listing?</div>
        </div>
        <div class="delete-product-body">
            <p class="delete-product-message">Are you sure you want to delete this textbook listing?</p>
            <p class="delete-product-sub-message">This action cannot be undone and the listing will be permanently removed.</p>
        </div>
        <div class="delete-product-footer">
            <button class="delete-product-cancel-btn" id="deleteProductCancelBtn">Cancel</button>
            <button class="delete-product-delete-btn" id="deleteProductConfirmBtn">Delete</button>
        </div>
    </div>
</div>
